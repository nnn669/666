<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: #101725;
    font: 15px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #d8e2f0;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  .stage {
    width: min(100%, 900px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    background: #bfe6f5;
  }
  svg { display: block; width: 100%; height: auto; }
  button {
    font: inherit;
    padding: 8px 18px;
    border: 1px solid #33415c;
    border-radius: 999px;
    background: #1a2437;
    color: #d8e2f0;
    cursor: pointer;
  }
  button:hover { background: #223050; }
  button:focus-visible { outline: 2px solid #7fd0ff; outline-offset: 2px; }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>

<div class="stage">
<svg viewBox="0 0 800 450" role="img" aria-labelledby="ttl desc" xmlns="http://www.w3.org/2000/svg" id="scene">
  <title id="ttl">一只鹈鹕骑着自行车沿海边公路前进</title>
  <desc id="desc">卡通风格的循环动画：鹈鹕戴着头盔踩踏板，车轮转动，背景的云、山丘和路面向左滚动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#79c8ea"/>
      <stop offset="55%" stop-color="#bfe6f5"/>
      <stop offset="100%" stop-color="#f2fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c828e"/>
      <stop offset="100%" stop-color="#5b6069"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6cf" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>

    <!-- 可复用的滚动素材，用两份首尾相接实现无缝循环 -->
    <g id="cloudBand">
      <g fill="#ffffff" opacity=".85">
        <ellipse cx="90"  cy="70"  rx="46" ry="20"/>
        <ellipse cx="120" cy="58"  rx="32" ry="18"/>
        <ellipse cx="58"  cy="62"  rx="26" ry="14"/>
        <ellipse cx="340" cy="46"  rx="38" ry="16"/>
        <ellipse cx="372" cy="38"  rx="26" ry="14"/>
        <ellipse cx="600" cy="88"  rx="52" ry="19"/>
        <ellipse cx="640" cy="78"  rx="30" ry="15"/>
      </g>
      <g fill="none" stroke="#2b3a4d" stroke-width="3" stroke-linecap="round" opacity=".5">
        <path d="M470 100 l10 -8 10 8"/>
        <path d="M496 112 l8 -6 8 6"/>
      </g>
    </g>

    <g id="hillsFar">
      <path d="M0 300 Q 90 232 190 292 T 380 288 Q 470 226 560 292 T 800 296 L800 340 L0 340 Z" fill="#8fc9a6"/>
    </g>
    <g id="hillsNear">
      <path d="M0 330 Q 120 276 250 322 T 470 316 Q 600 272 720 320 L800 332 L800 380 L0 380 Z" fill="#5fae78"/>
      <g fill="#4b9463">
        <path d="M120 322 l10 -26 10 26z"/>
        <path d="M300 318 l12 -30 12 30z"/>
        <path d="M540 316 l11 -28 11 28z"/>
        <path d="M690 324 l10 -24 10 24z"/>
      </g>
    </g>

    <g id="grassBand">
      <rect x="0" y="374" width="800" height="14" fill="#4f9c67"/>
      <g stroke="#3d8153" stroke-width="3" stroke-linecap="round">
        <path d="M40 376 l-4 -10"/><path d="M46 376 l3 -9"/>
        <path d="M210 376 l-4 -11"/><path d="M216 376 l4 -8"/>
        <path d="M420 376 l-3 -9"/><path d="M426 376 l4 -10"/>
        <path d="M640 376 l-4 -10"/><path d="M646 376 l3 -9"/>
      </g>
    </g>

    <g id="dashBand">
      <g fill="#f4f1e4" opacity=".9">
        <rect x="20"  y="414" width="70" height="7" rx="3.5"/>
        <rect x="170" y="414" width="70" height="7" rx="3.5"/>
        <rect x="320" y="414" width="70" height="7" rx="3.5"/>
        <rect x="470" y="414" width="70" height="7" rx="3.5"/>
        <rect x="620" y="414" width="70" height="7" rx="3.5"/>
      </g>
      <g fill="#8b909a" opacity=".5">
        <rect x="90"  y="396" width="34" height="4" rx="2"/>
        <rect x="380" y="440" width="48" height="4" rx="2"/>
        <rect x="600" y="398" width="40" height="4" rx="2"/>
      </g>
    </g>

    <g id="speedBand" stroke="#ffffff" stroke-linecap="round" opacity=".45">
      <path d="M40 180 h70"  stroke-width="4"/>
      <path d="M260 150 h50" stroke-width="3"/>
      <path d="M470 200 h80" stroke-width="4"/>
      <path d="M660 168 h56" stroke-width="3"/>
      <path d="M150 330 h60" stroke-width="3"/>
      <path d="M560 344 h70" stroke-width="4"/>
    </g>

    <!-- 车轮：轮辐在组内绕原点旋转 -->
    <g id="wheel">
      <circle r="45" fill="none" stroke="#23272f" stroke-width="9"/>
      <g>
        <g stroke="#d9dde4" stroke-width="2.2" opacity=".9">
          <line x1="-40" y1="0" x2="40" y2="0"/>
          <line x1="-34.6" y1="-20" x2="34.6" y2="20"/>
          <line x1="-20" y1="-34.6" x2="20" y2="34.6"/>
          <line x1="0" y1="-40" x2="0" y2="40"/>
          <line x1="20" y1="-34.6" x2="-20" y2="34.6"/>
          <line x1="34.6" y1="-20" x2="-34.6" y2="20"/>
        </g>
        <circle r="7" fill="#c3c9d2" stroke="#5d646f" stroke-width="2"/>
        <circle r="2.5" cx="26" cy="0" fill="#e8523f"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
      </g>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <g>
    <circle cx="706" cy="74" r="66" fill="url(#glow)"/>
    <circle cx="706" cy="74" r="27" fill="#ffe islands"/>
    <circle cx="706" cy="74" r="27" fill="#ffe985"/>
    <g stroke="#ffe985" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M706 32 v-12"/><path d="M706 116 v12"/>
      <path d="M664 74 h-12"/><path d="M748 74 h12"/>
      <path d="M676 44 l-9 -9"/><path d="M736 104 l9 9"/>
      <path d="M736 44 l9 -9"/><path d="M676 104 l-9 9"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 706 74;360 706 74" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <use href="#cloudBand"/><use href="#cloudBand" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="26s" repeatCount="indefinite"/>
  </g>

  <g>
    <use href="#hillsFar"/><use href="#hillsFar" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <g>
    <use href="#hillsNear"/><use href="#hillsNear" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <g>
    <use href="#speedBand"/><use href="#speedBand" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="0.9s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="385" width="800" height="65" fill="url(#road)"/>
  <rect x="0" y="385" width="800" height="4" fill="#4a4f58" opacity=".6"/>

  <g>
    <use href="#grassBand"/><use href="#grassBand" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="2s" repeatCount="indefinite"/>
  </g>

  <g>
    <use href="#dashBand"/><use href="#dashBand" x="800"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-800 0" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- 后轮扬起的尘土 -->
  <g fill="#e9e4d6" opacity=".7">
    <circle cx="258" cy="372" r="9">
      <animate attributeName="cx" values="258;196" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="372;352" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r"  values="4;16" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="258" cy="376" r="7">
      <animate attributeName="cx" values="258;204" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="376;366" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="r"  values="3;13" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= 自行车 + 鹈鹕 ================= -->
  <!-- 整体轻微上下颠簸，保持脚与踏板的相对关系不变 -->
  <g id="rig">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -2.5;0 0;0 1.5;0 0" dur="0.45s" repeatCount="indefinite"/>

    <!-- 影子 -->
    <ellipse cx="400" cy="388" rx="150" ry="9" fill="#000000" opacity=".18"/>

    <!-- 车轮 -->
    <use href="#wheel" x="300" y="340"/>
    <use href="#wheel" x="500" y="340"/>

    <!-- 远侧腿（先画，位于车架之后） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-55.3 378 262;-37.3 378 262;-26.9 378 262;-30.8 378 262;-40.6 378 262;-54.2 378 262;-66.9 378 262;-67.7 378 262;-55.3 378 262"
        dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
      <line x1="378" y1="262" x2="378" y2="317" stroke="#c9762a" stroke-width="14" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="61.1 378 317;35.9 378 317;30 378 317;52.1 378 317;78.1 378 317;97 378 317;100.3 378 317;85.8 378 317;61.1 378 317"
          dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
        <line x1="378" y1="317" x2="378" y2="369" stroke="#c9762a" stroke-width="10" stroke-linecap="round"/>
        <path d="M378 369 l16 6 -3 7 -16 -4z" fill="#b96a25"/>
      </g>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#2f3b52" stroke-linecap="round">
      <path d="M400 345 L300 340" stroke-width="8"/>
      <path d="M400 345 L360 272" stroke-width="9"/>
      <path d="M400 345 L470 300" stroke-width="9"/>
      <path d="M360 272 L478 262" stroke-width="8"/>
      <path d="M360 272 L300 340" stroke-width="7"/>
      <path d="M470 300 L478 258" stroke-width="8"/>
      <path d="M474 282 L500 340" stroke-width="7"/>
      <path d="M478 260 L506 254" stroke-width="7"/>
      <path d="M506 254 q10 2 8 12" stroke-width="6"/>
    </g>
    <!-- 车座 -->
    <path d="M338 272 q22 -12 40 -2 q-12 10 -40 6z" fill="#22262e"/>
    <!-- 链条 + 齿盘 -->
    <path d="M400 338 L302 336 M400 352 L302 344" stroke="#8f96a3" stroke-width="3" fill="none"/>
    <circle cx="400" cy="345" r="15" fill="none" stroke="#9aa2b1" stroke-width="3"/>
    <!-- 车铃 -->
    <circle cx="500" cy="246" r="6" fill="#e8523f" stroke="#8f2f24" stroke-width="2"/>

    <!-- 鹈鹕身体 -->
    <g>
      <!-- 尾羽 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 306 236;-6 306 236;0 306 236;5 306 236;0 306 236"
                          dur="0.9s" repeatCount="indefinite"/>
        <path d="M306 226 L252 208 L304 240z" fill="#e3e3d8"/>
        <path d="M306 236 L246 232 L306 250z" fill="#efeee5"/>
      </g>

      <path d="M300 232 C302 200 330 190 358 192 C398 194 420 214 418 240
               C416 268 386 282 352 280 C318 278 298 262 300 232 Z"
            fill="#fdfdfa"/>
      <path d="M312 262 C336 280 384 282 414 258 C408 274 384 282 352 280 C332 279 318 272 312 262 Z"
            fill="#e6e6db"/>

      <!-- 脖子 -->
      <path d="M392 240 Q400 194 442 172" fill="none" stroke="#fdfdfa"
            stroke-width="28" stroke-linecap="round"/>

      <!-- 头 -->
      <ellipse cx="460" cy="162" rx="27" ry="24" fill="#fdfdfa"/>

      <!-- 喙 + 喉囊 -->
      <path d="M448 152 C482 150 542 160 580 174 C560 179 500 177 452 172 Z" fill="#f5a623"/>
      <path d="M456 170 C462 200 500 212 540 200 C560 192 573 182 578 176 L452 172 Z" fill="#f2bd63"/>
      <path d="M578 174 q8 2 6 7 q-6 1 -10 -3z" fill="#e2901a"/>
      <!-- 喉囊里露出的小鱼尾 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-10 520 200;12 520 200;-10 520 200" dur="0.8s" repeatCount="indefinite"/>
        <path d="M520 200 l14 12 -3 -14 12 8 -6 -16z" fill="#6fc3d8"/>
      </g>

      <!-- 眼睛 + 眨眼 -->
      <circle cx="458" cy="154" r="6" fill="#ffffff"/>
      <circle cx="459" cy="154" r="3.4" fill="#22262e"/>
      <ellipse cx="458" cy="154" rx="6.4" ry="0" fill="#fdfdfa">
        <animate attributeName="ry" values="0;0;6.4;0;0" keyTimes="0;0.9;0.94;0.98;1"
                 dur="4.2s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 头盔 -->
      <path d="M431 154 C428 126 456 110 481 121 C498 129 503 143 498 156 Z" fill="#e8523f"/>
      <path d="M431 154 C428 126 456 110 481 121 C498 129 503 143 498 156 Z"
            fill="none" stroke="#b8392b" stroke-width="2"/>
      <g stroke="#b8392b" stroke-width="2.5" stroke-linecap="round">
        <path d="M448 124 l-4 26"/><path d="M468 119 l-3 30"/>
      </g>

      <!-- 围巾 -->
      <ellipse cx="412" cy="206" rx="11" ry="8" fill="#3f7fd6"/>
      <path d="M406 206 C372 196 342 208 304 190" fill="none" stroke="#3f7fd6"
            stroke-width="12" stroke-linecap="round">
        <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
          values="M406 206 C372 196 342 208 304 190;
                  M406 206 C374 210 340 190 302 200;
                  M406 206 C372 196 342 208 304 190"/>
      </path>
    </g>

    <!-- 曲柄 + 踏板（踏板反向自转以保持水平） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 400 345;360 400 345" dur="0.9s" repeatCount="indefinite"/>
      <line x1="382" y1="345" x2="418" y2="345" stroke="#4d5872" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 418 345;-360 418 345" dur="0.9s" repeatCount="indefinite"/>
        <rect x="406" y="342" width="24" height="6" rx="3" fill="#22262e"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 382 345;-360 382 345" dur="0.9s" repeatCount="indefinite"/>
        <rect x="370" y="342" width="24" height="6" rx="3" fill="#3a3f49"/>
      </g>
    </g>

    <!-- 近侧腿 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-55.3 378 262;-37.3 378 262;-26.9 378 262;-30.8 378 262;-40.6 378 262;-54.2 378 262;-66.9 378 262;-67.7 378 262;-55.3 378 262"
        dur="0.9s" repeatCount="indefinite"/>
      <line x1="378" y1="262" x2="378" y2="317" stroke="#f0972a" stroke-width="15" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="61.1 378 317;35.9 378 317;30 378 317;52.1 378 317;78.1 378 317;97 378 317;100.3 378 317;85.8 378 317;61.1 378 317"
          dur="0.9s" repeatCount="indefinite"/>
        <line x1="378" y1="317" x2="378" y2="369" stroke="#f6a63f" stroke-width="11" stroke-linecap="round"/>
        <path d="M378 368 l20 7 -3 8 -20 -5z" fill="#e08b1e"/>
      </g>
    </g>

    <!-- 翅膀（握把手） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 388 230;1.2 388 230;0 388 230;-1.2 388 230;0 388 230"
                        dur="0.45s" repeatCount="indefinite"/>
      <path d="M386 214 C420 220 454 234 482 250 C487 257 482 267 473 264
               C444 254 410 246 382 244 C374 234 377 218 386 214 Z" fill="#f4f4ec"/>
      <g fill="none" stroke="#dcdcd0" stroke-width="2.5" stroke-linecap="round">
        <path d="M400 226 q26 10 46 22"/>
        <path d="M396 236 q26 8 44 18"/>
      </g>
      <ellipse cx="478" cy="256" rx="10" ry="8" fill="#fdfdfa"/>
    </g>
  </g>
</svg>
</div>

<button id="toggle" type="button" aria-pressed="false">暂停动画</button>

<script>
  const svg = document.getElementById('scene');
  const btn = document.getElementById('toggle');
  let paused = false;

  function setPaused(next) {
    paused = next;
    if (paused) { svg.pauseAnimations(); } else { svg.unpauseAnimations(); }
    btn.textContent = paused ? '继续动画' : '暂停动画';
    btn.setAttribute('aria-pressed', String(paused));
  }

  btn.addEventListener('click', () => setPaused(!paused));

  // 尊重系统的“减少动态效果”偏好
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setPaused(true);
  }
</script>

</body>
</html>
